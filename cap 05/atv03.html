<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitação de Matrícula Acadêmica</title>
</head>
<body>

    <h1>Solicitação de Matrícula Acadêmica</h1>
    <p><strong>* Campos obrigatórios</strong></p>
    <form action="https://httpbin.org/post" method="post">
        <fieldset>
            <legend>Dados Pessoais</legend>
            
            <div>
                <label for="nome">Nome completo *:</label>
                <input type="text" id="nome" name="nome" required minlength="5" maxlength="100">
            </div>

            <div>
                <label for="cpf">CPF *:</label>
                <input type="text" id="cpf" name="cpf" required pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" placeholder="000.000.000-00" title="CPF no formato 000.000.000-00">
            </div>

            <div>
                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" pattern="\(\d{2}\)\s\d{4,5}-\d{4}" placeholder="(82) 99999-9999">
            </div>

            <div>
                <label for="email">E-mail *:</label>
                <input type="email" id="email" name="email" required>
            </div>
        </fieldset>
        <fieldset>
            <legend>Dados Acadêmicos</legend>
            
            <div>
                <label for="curso">Curso pretendido *:</label>
                <select id="curso" name="curso" required>
                    <option value="">Selecione um curso...</option>
                    <optgroup label="Computação">
                        <option value="sistemas_informacao">Sistemas de Informação</option>
                        <option value="ciencia_computacao">Ciência da Computação</option>
                        <option value="engenharia_computacao">Engenharia da Computação</option>
                    </optgroup>
                    <optgroup label="Gestão">
                        <option value="administracao">Administração</option>
                        <option value="ciencias_contabeis">Ciências Contábeis</option>
                    </optgroup>
                </select>
            </div>

            <fieldset>
                <legend>Período *</legend>
                
                <input type="radio" id="periodo_manha" name="periodo" value="manha" required>
                <label for="periodo_manha">Manhã</label>

                <input type="radio" id="periodo_tarde" name="periodo" value="tarde">
                <label for="periodo_tarde">Tarde</label>

                <input type="radio" id="periodo_noite" name="periodo" value="noite">
                <label for="periodo_noite">Noite</label>
            </fieldset>

            <div>
                <label for="ano_ingresso">Ano de ingresso pretendido *:</label>
                <input type="number" id="ano_ingresso" name="ano_ingresso" min="2025" max="2030" required>
            </div>
        </fieldset>
        <fieldset>
            <legend>Áreas de Interesse</legend>
            <p>Selecione os tópicos que você mais se identifica:</p>

            <div>
                <input type="checkbox" id="interesse_web" name="interesses[]" value="desenvolvimento_web">
                <label for="interesse_web">Desenvolvimento Web</label>
            </div>
            <div>
                <input type="checkbox" id="interesse_bd" name="interesses[]" value="banco_dados">
                <label for="interesse_bd">Banco de Dados</label>
            </div>
            <div>
                <input type="checkbox" id="interesse_ia" name="interesses[]" value="inteligencia_artificial">
                <label for="interesse_ia">Inteligência Artificial</label>
            </div>
            <div>
                <input type="checkbox" id="interesse_seg" name="interesses[]" value="seguranca_informacao">
                <label for="interesse_seg">Segurança da Informação</label>
            </div>
            <div>
                <input type="checkbox" id="interesse_infra" name="interesses[]" value="infraestrutura">
                <label for="interesse_infra">Infraestrutura</label>
            </div>
        </fieldset>
        <div>
            <button type="submit">Solicitar matrícula</button>
            <button type="reset">Limpar formulário</button>
        </div>

    </form>

</body>
</html>
